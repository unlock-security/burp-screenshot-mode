name: Release

on:
  push:
    branches: [main]

# One release at a time, in push order.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version tag and create the GitHub release
      issues: write # comment on released issues, open an issue if the release fails
      pull-requests: write # comment on released pull requests
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # semantic-release needs the full history and tags
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Computes the next version from the commits since the last tag, builds the jar with it, tags the commit
      # and publishes the GitHub release. Does nothing when no commit warrants a release (e.g. only docs/chore).
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Brings dev up to date with main (release merge commit and tags) without rewriting history: a fast-forward
  # when dev has no new commits, a merge otherwise. Pushes made with GITHUB_TOKEN don't trigger other workflows.
  sync-dev:
    name: Sync dev with main
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # push dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
      - name: Fast-forward or merge main into dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --ff-only origin/main || git merge --no-edit -m "chore: merge main into dev" origin/main
          git push origin dev
